# causal.yaml — Neuralis 設計期因果鏈
#
# topology.yaml 管「執行期」：邊現在通不通，每條有 probe 真打一輪。
# 這份管「設計期」：誰卡著誰，為什麼還沒做，解開一個能連帶解開幾個。
#
# 兩份的分工是硬的，別混：
#   - 「A 呼叫 B 但斷了」        → topology.yaml（可探測）
#   - 「A 沒做因為 B 還沒建好」  → 這裡（探測不到，只能宣告）
#
# 規矩（沿用 topology.yaml，加一條）：
#   - 每個 blocker 都要有 src，指回真實出處。沒 src 的是幻覺，刪掉。
#   - 一個項目只准出現在一個 blocker 的 to 裡。多重阻塞列 also_blocked_by。
#   - 狀態只有四種：done / partial / not_started / sealed。不准自創。
#
# 用法：./brain/blast.py <id>   → 看動它會炸到誰

version: 1
updated: 2026-08-23   # rust-psi 假缺口修正 + 兩個過期 risk 重測
source: Aris/Scream 完整管線地圖 v2 (2026-07-26) §6 §11

