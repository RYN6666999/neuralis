    role: 大腦 · 主樞紐
    repo: RYN6666999/neuralis
    owned: true

  - id: LB-arcanum
    role: 語意記憶源頭（gbrain）
    repo: RYN6666999/LB-arcanum
    owned: true

  - id: agentOS
    role: 工具面 · 38 工具 registry
    repo: RYN6666999/agent-sandbox
    owned: true

  - id: scream
    role: 身體 · CLI + 42 工具
    repo: LIUTod/scream-code
    owned: false          # ← 上游，不是你的
    install: npm 全域 /opt/homebrew/lib/node_modules/scream-code
    risk: 本地 0.10.0 落後 npm latest 0.10.13 共 13 版（drift.py 實測 2026-07-27）

  - id: laap-upstream
    role: laap-core · PSI 引擎源頭
    repo: lorryjovens-hub/laap-AGI
    owned: false          # ← 上游，不是你的
    risk: 本地在 feat/env-config-hermes，已與 upstream/main 分岔

# ── 阻塞鏈：誰卡著誰 ──
# from 沒完成 → to 全部動不了。這是「牽一髮動全身」的實體。
blockers:
  - id: confidence-gate
    label: Confidence 閘（四繩計算）
    status: partial
    done: [寫入端硬閘, origin/confidence/provenance 三欄, 封頂, relay 帶 origin]
    missing: [四繩計算, 檢索過濾, 黃轉綠升格路徑]
    blocks: [固化cron, 檢索過濾, 升格路徑, 修剪cron]
    src: 管線地圖 §11 #6 #9 #14
    note: 下游 4 個全 P0。目前圖上最高槓桿點。
    evidence: |
      brain/memcheck.py 2026-07-27 唯讀實測 ~/.aris-memory.db（152 筆）：
      · confidence 欄 152/152 全 yellow —— 零 green 零 red
      · origin 欄 152/152 全 auto_generated —— 零 human
      · provenance 欄 152/152 全空
      三欄都存在（有人設計過），但沒有任何邏輯在填。
      這是「閘宣告了但沒接線」的硬證據，不是推論。
    verify: python3 brain/memcheck.py

  - id: salience-gate
    label: Salience 閘（什麼值得學 vs 雜訊）
    status: not_started
    done: [spec 已寫在 2-記憶系統/]
    missing: [Phase 1 編碼]
    blocks: [值得學判斷, 修剪cron]
    src: 管線地圖 §6 §11 #8
    note: spec 齊了但沒開工。第二高槓桿。

  - id: 固化cron
    label: 海馬→皮質升格 cron
    status: not_started
    blocked_by: [confidence-gate]
    blocks: [重建式查詢]
    src: 管線地圖 §11 #9

  - id: 修剪cron
    label: 修剪 cron（只剪連結不刪頁）
    status: not_started
    blocked_by: [confidence-gate, salience-gate]
    src: 管線地圖 §11 #11
    note: 雙重阻塞，最晚能動的一個。

  - id: 檢索過濾
    label: confidence 檢索過濾
    status: not_started
    blocked_by: [confidence-gate]
    src: 管線地圖 §11 #6

  - id: 升格路徑
    label: 黃轉綠升格
    status: not_started
    blocked_by: [confidence-gate]
