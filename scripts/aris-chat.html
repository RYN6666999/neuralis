<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Aris</title>
<meta name="theme-color" content="#0b0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aris">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%237c5cff'/%3E%3Cstop%20offset='1'%20stop-color='%23b07bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='512'%20height='512'%20rx='112'%20fill='url(%23g)'/%3E%3Cpath%20d='M256%20132l30%2078%2078%2030-78%2030-30%2078-30-78-78-30%2078-30z'%20fill='%23fff'/%3E%3Ccircle%20cx='150'%20cy='372'%20r='20'%20fill='%23fff'%20opacity='.85'/%3E%3Ccircle%20cx='372'%20cy='150'%20r='14'%20fill='%23fff'%20opacity='.7'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b12; --bg2:#12121c;
  --header:rgba(16,16,26,.72);
  --aris:#1b1b28; --aris-border:#26263a; --aris-text:#e6e6f0;
  --me1:#6d4aff; --me2:#9a6bff; --me-text:#ffffff;
  --muted:#7a7a90; --faint:#565669;
  --accent:#b79bff; --online:#4ade80;
  --divider:rgba(255,255,255,.06);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--aris-text);
  display:flex;flex-direction:column;height:100dvh;
  background-image:
    radial-gradient(1200px 600px at 80% -10%,rgba(124,92,255,.14),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(176,123,255,.10),transparent 55%);
  background-attachment:fixed;
}

/* header */
#head{
  position:sticky;top:0;z-index:20;
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  display:flex;align-items:center;gap:11px;
  background:var(--header);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--divider);
}
#head .av{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 2px 10px rgba(124,92,255,.4)}
#head .who{display:flex;flex-direction:column;line-height:1.25}
#head .who b{font-size:16px;font-weight:600;letter-spacing:.2px}
#head .who small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
#head .who small .d{width:7px;height:7px;border-radius:50%;background:var(--online);box-shadow:0 0 8px var(--online)}
#head .who small.off .d{background:var(--faint);box-shadow:none}
#newchat{margin-left:auto;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--aris-border);background:rgba(255,255,255,.04);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s,transform .12s}
#newchat:hover{background:rgba(255,255,255,.08);color:var(--accent)}
#newchat:active{transform:scale(.9)}
#newchat svg{width:19px;height:19px}
#menu{width:36px;height:36px;flex:none;border-radius:50%;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .15s,transform .12s}
#menu:hover{color:var(--accent)}
#menu:active{transform:scale(.9)}
#menu svg{width:22px;height:22px}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .2s;z-index:30}
#scrim.open{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(330px,84vw);background:var(--bg2);border-right:1px solid var(--divider);
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:31;display:flex;flex-direction:column;
  padding-top:var(--safe-t);box-shadow:2px 0 24px rgba(0,0,0,.4)}
#drawer.open{transform:none}
#drawer .dhead{padding:16px 18px 12px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--divider)}
#convlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--safe-b)}
.conv{padding:13px 16px;border-bottom:1px solid var(--divider);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:8px}
.conv:hover{background:rgba(255,255,255,.04)}
.conv.active{background:rgba(124,92,255,.15)}
.conv .cmain{flex:1;min-width:0}
.conv .p{font-size:14.5px;color:var(--aris-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .s{font-size:11.5px;color:var(--faint);margin-top:4px;display:flex;gap:9px;align-items:center}
.conv .s .badge{color:var(--accent)}
.conv .del{flex:none;width:34px;height:34px;border:none;background:transparent;color:var(--faint);border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:color .12s,background .12s}
.conv .del:hover{color:#f87171;background:rgba(248,113,113,.13)}
.conv .del svg{width:17px;height:17px}

/* messages */
#log{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 12px 8px;display:flex;flex-direction:column;gap:3px;
}
.divider{align-self:center;margin:12px 0 8px}
.divider span{
  font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.05);
  padding:4px 12px;border-radius:11px;
}
.row{display:flex;gap:8px;max-width:100%;align-items:flex-end;animation:pop .26s cubic-bezier(.2,.9,.3,1.2) both}
.row.aris{justify-content:flex-start}
.row.me{justify-content:flex-end}
.row+.row{margin-top:2px}
.row.gap{margin-top:10px}
.row .av{width:28px;height:28px;border-radius:50%;flex:none;margin-bottom:2px}
.row.me .av{display:none}
.stack{display:flex;flex-direction:column;max-width:78%;min-width:0}
.bubble{
  padding:9px 13px;border-radius:18px;font-size:15.5px;line-height:1.48;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
}
.row.aris .bubble{
  background:var(--aris);border:1px solid var(--aris-border);color:var(--aris-text);
  border-bottom-left-radius:6px;
}
.row.me .bubble{
  background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-text);
  border-bottom-right-radius:6px;box-shadow:0 2px 12px rgba(109,74,255,.28);
}
/* collapse avatar + radius on consecutive aris msgs */
.row.aris.cont .av{visibility:hidden}
.row.aris.cont .bubble{border-top-left-radius:6px}
.row.me.cont .bubble{border-top-right-radius:6px}
.meta{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--faint);margin:3px 4px 0}
.row.me .meta{justify-content:flex-end}
.meta .tick{color:var(--faint);font-size:11px;letter-spacing:-2px;transition:color .3s}
.meta .tick.read{color:var(--accent)}

/* typing */
.typing .bubble{padding:12px 15px;display:flex;gap:5px;align-items:center}
.typing .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.25s infinite ease-in-out}
.typing .dot:nth-child(2){animation-delay:.18s}
.typing .dot:nth-child(3){animation-delay:.36s}

/* composer */
#bar{
  padding:8px 10px calc(var(--safe-b) + 8px);
  background:var(--header);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--divider);
  display:flex;align-items:flex-end;gap:9px;
}
#in{
  flex:1;resize:none;border:1px solid var(--aris-border);border-radius:22px;
  background:var(--bg2);color:var(--aris-text);
  font:inherit;font-size:16px;line-height:1.4;padding:10px 15px;
  max-height:132px;outline:none;transition:border-color .2s;
}
#in:focus{border-color:var(--accent)}
#in::placeholder{color:var(--faint)}
#send{
  width:44px;height:44px;flex:none;border:none;border-radius:50%;
  background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 12px rgba(109,74,255,.4);transition:transform .12s,opacity .2s;
}
#send:active{transform:scale(.9)}
#send:disabled{opacity:.35;box-shadow:none;cursor:default}
#send svg{width:21px;height:21px}

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.row{animation:none}.typing .dot{animation:none}}
</style>
</head>
<body>
<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead">對話</div>
  <div id="convlist"></div>
</aside>

<div id="head">
  <button id="menu" aria-label="對話列表" title="對話列表">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <svg class="av" viewBox="0 0 512 512"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b07bff"/></linearGradient></defs><rect width="512" height="512" rx="256" fill="url(#hg)"/><path d="M256 132l30 78 78 30-78 30-30 78-30-78-78-30 78-30z" fill="#fff"/></svg>
  <div class="who">
    <b>Aris</b>
    <small id="status"><span class="d"></span><span id="statusText">在線上</span></small>
  </div>
  <button id="newchat" aria-label="開新對話" title="開新對話">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
  </button>
</div>

<div id="log"></div>

<div id="bar">
  <textarea id="in" rows="1" placeholder="跟 Aris 說點什麼…" enterkeyhint="send" autocomplete="off"></textarea>
  <button id="send" aria-label="送出">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l15-7-6 15-2.5-5.5L4 12z" fill="currentColor"/></svg>
  </button>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('in'), sendBtn = $('send');
const UID = 'ryan';
let CONV = localStorage.getItem('aris_conv') || 'web-2';
let LS = 'aris_chat_' + CONV;
const ARIS_AV = '<svg class="av" viewBox="0 0 512 512"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b07bff"/></linearGradient></defs><rect width="512" height="512" rx="256" fill="url(#ag)"/><path d="M256 150l24 62 62 24-62 24-24 62-24-62-62-24 62-24z" fill="#fff"/></svg>';

let lastDay = null, lastRole = null, sending = false;

const fmtTime = ts => new Date(ts).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
function dayLabel(ts){
  const d = new Date(ts), n = new Date();
  const same = (a,b)=>a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate();
  if(same(d,n)) return '今天';
  const y = new Date(n); y.setDate(n.getDate()-1);
  if(same(d,y)) return '昨天';
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function maybeDivider(ts){
  const key = new Date(ts).toDateString();
  if(key === lastDay) return;
  lastDay = key; lastRole = null;
  const div = document.createElement('div');
  div.className = 'divider';
  div.innerHTML = `<span>${dayLabel(ts)}</span>`;
  log.appendChild(div);
}
function atBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 120; }
function toBottom(smooth){ log.scrollTo({top:log.scrollHeight, behavior: smooth?'smooth':'auto'}); }

// role: 'aris' | 'me'. returns the row element.
function addMsg(role, text, ts, tick){
  maybeDivider(ts);
  const cont = role === lastRole;
  lastRole = role;
  const stick = atBottom();
  const row = document.createElement('div');
  row.className = 'row ' + role + (cont ? ' cont' : ' gap');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span>${fmtTime(ts)}</span>` + (role==='me' ? `<span class="tick${tick==='read'?' read':''}">${tick?'✓✓':'✓'}</span>` : '');
  const stack = document.createElement('div');
  stack.className = 'stack';
  stack.append(bubble, meta);
  if(role === 'aris'){
    const av = document.createElement('div');
    av.innerHTML = ARIS_AV; row.append(av.firstChild, stack);
  } else row.append(stack);
  log.appendChild(row);
  if(stick) toBottom();
  return row;
}

let typingEl = null;
function showTyping(){
  if(typingEl) return;
  lastRole = null;
  const stick = atBottom();
  typingEl = document.createElement('div');
  typingEl.className = 'row aris gap typing';
  const av = document.createElement('div'); av.innerHTML = ARIS_AV;
  typingEl.append(av.firstChild, Object.assign(document.createElement('div'),{
    className:'stack', innerHTML:'<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>'
  }));
  log.appendChild(typingEl);
  if(stick) toBottom(true);
}
function hideTyping(){ if(typingEl){ typingEl.remove(); typingEl = null; lastRole = null; } }

// persistence: array of {role,text,ts}
let store = [];
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(store.slice(-200))); }catch(e){} }
function record(role, text, ts){ store.push({role,text,ts}); persist(); }

function render(items){
  log.innerHTML = ''; lastDay = null; lastRole = null;
  for(const m of items) addMsg(m.role, m.text, m.ts, m.role==='me' ? 'read' : null);
  toBottom();
}

async function loadHistory(){
  // paint cached instantly
  try{ const c = JSON.parse(localStorage.getItem(LS)||'[]'); if(c.length){ store = c; render(c); } }catch(e){}
  // reconcile with server truth
  try{
    const r = await fetch(`/events/${CONV}`, {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    const items = [];
    for(const ev of (d.events||[])){
      const ts = (ev.ts||0)*1000, p = ev.payload||{};
      if(p.text) items.push({role:'me', text:p.text, ts});
      if(p.reply) items.push({role:'aris', text:p.reply, ts: ts+1});
    }
    if(items.length){ store = items; persist(); render(items); return; }
  }catch(e){}
  if(!store.length) greet();
}
function greet(){
  const ts = Date.now();
  addMsg('aris', '嗨 Ryan。我在這裡陪你。', ts, null);
  record('aris', '嗨 Ryan。我在這裡陪你。', ts);
}

// 手機長 hold 中斷後，reply 其實已落 relay DB — 從 event log 撈回，不假報中斷
async function recoverReply(sinceTs){
  try{
    const r = await fetch(`/events/${CONV}`, {cache:'no-store'});
    if(!r.ok) return null;
    const d = await r.json();
    let found = '';
    for(const ev of (d.events||[])){
      const p = ev.payload||{}, ts = (ev.ts||0)*1000;
      if(p.reply && ts >= sinceTs - 3000) found = p.reply;   // 我這句之後最新的回覆
    }
    return found.trim() || null;
  }catch(e){ return null; }
}

async function send(){
  const text = input.value.trim();
  if(!text || sending) return;
  sending = true; sendBtn.disabled = true;
  input.value = ''; autosize();
  const ts = Date.now();
  const row = addMsg('me', text, ts, null);   // single tick = sent
  record('me', text, ts);
  const tick = row.querySelector('.tick');
  setOnline(true);
  showTyping();

  let reply = null;
  try{
    const ac = new AbortController();
    const to = setTimeout(() => ac.abort(), 80000);   // 上限，超過改用撈回
    const r = await fetch('/c', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, conv:CONV, uid:UID}), signal: ac.signal});
    clearTimeout(to);
    const d = await r.json();
    reply = (d.reply||'').trim() || null;
  }catch(e){ /* 連線在長 hold 中斷 — 往下從 event log 撈回 */ }

  // 沒直接拿到回覆（連線中斷 / relay 60s timeout）→ 保持「輸入中」輪詢撈回
  for(let i = 0; i < 6 && !reply; i++){
    await new Promise(res => setTimeout(res, 2500));
    reply = await recoverReply(ts);
  }

  hideTyping();
  if(reply){
    if(tick){ tick.textContent = '✓✓'; tick.classList.add('read'); }  // delivered
    const rt = Date.now(); addMsg('aris', reply, rt, null); record('aris', reply, rt);
  }else{
    setOnline(false);
    addMsg('aris', '（我還在想，等等再問我一次？）', Date.now(), null);
  }
  sending = false; sendBtn.disabled = false; input.focus();
}

function setOnline(ok){
  $('status').classList.toggle('off', !ok);
  $('statusText').textContent = ok ? '在線上' : '連線中';
}
async function ping(){
  try{ const r = await fetch('/health',{cache:'no-store'}); setOnline(r.ok); }catch(e){ setOnline(false); }
}

// composer behaviour
function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 132) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

function newChat(){
  if(store.length && !confirm('開一個新對話？目前這串會收起來（不會刪掉）。')) return;
  CONV = 'web-' + Date.now();
  localStorage.setItem('aris_conv', CONV);
  LS = 'aris_chat_' + CONV;
  store = []; log.innerHTML = ''; lastDay = null; lastRole = null;
  hideTyping();
  greet();
  input.focus();
}
$('newchat').addEventListener('click', newChat);

// ── conversation drawer ──
const drawer = $('drawer'), scrim = $('scrim'), convlist = $('convlist');
function openDrawer(){ scrim.classList.add('open'); drawer.classList.add('open'); loadConvs(); }
function closeDrawer(){ scrim.classList.remove('open'); drawer.classList.remove('open'); }
$('menu').addEventListener('click', openDrawer);
scrim.addEventListener('click', closeDrawer);

function relTime(ts){
  const d = new Date(ts), n = new Date(), day = (a,b)=>a.toDateString()===b.toDateString();
  if(day(d,n)) return fmtTime(ts);
  const y = new Date(n); y.setDate(n.getDate()-1);
  if(day(d,y)) return '昨天';
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function convMsg(text){
  const row = document.createElement('div'); row.className = 'conv';
  row.innerHTML = `<div class="p" style="color:var(--faint)"></div>`;
  row.querySelector('.p').textContent = text; return row;
}
async function loadConvs(){
  convlist.replaceChildren(convMsg('載入中…'));
  try{
    const r = await fetch('/conversations', {cache:'no-store'});
    const list = (await r.json()).conversations || [];
    if(!list.length){ convlist.replaceChildren(convMsg('還沒有對話')); return; }
    convlist.replaceChildren();
    for(const c of list){
      const row = document.createElement('div');
      row.className = 'conv' + (c.conversation_id===CONV ? ' active' : '');
      row.innerHTML = `<div class="cmain"><div class="p"></div><div class="s"><span class="tm"></span><span class="badge"></span></div></div>`
        + `<button class="del" aria-label="刪除對話"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0v14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M10 11v6M14 11v6"/></svg></button>`;
      row.querySelector('.p').textContent = c.preview || '（無內容）';
      row.querySelector('.tm').textContent = relTime((c.last_ts||0)*1000);
      row.querySelector('.badge').textContent = c.count + ' 則';
      row.querySelector('.cmain').addEventListener('click', ()=>{ closeDrawer(); if(c.conversation_id!==CONV) switchConv(c.conversation_id); });
      row.querySelector('.del').addEventListener('click', (e)=>{ e.stopPropagation(); delConv(c.conversation_id); });
      convlist.appendChild(row);
    }
  }catch(e){ convlist.replaceChildren(convMsg('讀取失敗')); }
}
function switchConv(id){
  CONV = id; localStorage.setItem('aris_conv', id); LS = 'aris_chat_' + CONV;
  store = []; log.innerHTML = ''; lastDay = null; lastRole = null; hideTyping();
  loadHistory();
}
async function delConv(id){
  if(!confirm('刪除這段對話？無法復原。')) return;
  try{
    const r = await fetch('/conversations/' + encodeURIComponent(id), {method:'DELETE'});
    if(!r.ok) throw 0;
    try{ localStorage.removeItem('aris_chat_' + id); }catch(_){}
    if(id === CONV){   // deleted the one we're viewing → drop into a fresh conv
      CONV = 'web-' + Date.now(); localStorage.setItem('aris_conv', CONV); LS = 'aris_chat_' + CONV;
      store = []; log.innerHTML = ''; lastDay = null; lastRole = null; hideTyping(); greet();
    }
    loadConvs();
  }catch(e){ alert('刪除失敗，等等再試'); }
}
