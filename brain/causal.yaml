# ── 阻塞鏈：誰卡著誰 ──
# from 沒完成 → to 全部動不了。這是「牽一髮動全身」的實體。
blockers:
  - id: confidence-gate
    label: Confidence 閘（四繩計算）
    status: partial
    done: [寫入端硬閘, origin/confidence/provenance 三欄, 封頂, relay 帶 origin]
    missing: [四繩計算, 檢索過濾, 黃轉綠升格路徑]
    blocks: [固化cron, 檢索過濾, 升格路徑, 修剪cron]
    src: 管線地圖 §11 #6 #9 #14
    note: 下游 4 個全 P0。目前圖上最高槓桿點。
    evidence: |
      ⚠️ 2026-08-23 重跑 verify 指令，前一版 evidence 三條全部過期：

                    2026-07-27（原文）    2026-08-23（重測）
        總筆數      152                   1164
        confidence  全 yellow，零 red      red 115 / yellow 1049
        origin      全 auto_generated      auto 1163 / human 1
        provenance  全空                   1/1164 有

      memcheck 現在把那三項都標 🟢（不再是問題），但 **status 仍是 partial**：
      missing 的「黃轉綠升格路徑」還成立 —— 分級開始有東西在填了（red 出現），
      但只到 red/yellow 兩級，**零筆升到 green**。

      memcheck 目前唯一的 🔴 是 gbrain_never_synced（1164 筆 synced_to_gbrain
      全為 0，而 gbrain 有 5041 個 md），它自己指回本檔的「固化cron」。

      ⚠️ 教訓：evidence 欄裡的數字是流動量。這三行躺了將近一個月沒人重跑，
      而 verify 指令一直就寫在下面那一行 —— **有 verify 不等於有人跑。**
    verify: python3 brain/memcheck.py

  - id: salience-gate
    label: Salience 閘（什麼值得學 vs 雜訊）
    status: not_started
    done: [spec 已寫在 2-記憶系統/]
    missing: [Phase 1 編碼]
    blocks: [值得學判斷, 修剪cron]
    src: 管線地圖 §6 §11 #8
    note: spec 齊了但沒開工。第二高槓桿。

  - id: 固化cron
    label: 海馬→皮質升格 cron
    status: not_started
    blocked_by: [confidence-gate]
    blocks: [重建式查詢]
    src: 管線地圖 §11 #9

  - id: 修剪cron
    label: 修剪 cron（只剪連結不刪頁）
    status: not_started
    blocked_by: [confidence-gate, salience-gate]
    src: 管線地圖 §11 #11
    note: 雙重阻塞，最晚能動的一個。

  - id: 檢索過濾
    label: confidence 檢索過濾
    status: partial
    done: [confidence_gte 參數, SQL CASE 閾值比較, 6 個測試案例含反向測試]
    missing: [生產呼叫端 —— 全 repo 零個地方傳這個參數]
    blocked_by: [confidence-gate]
    src: 管線地圖 §11 #6
    evidence: |
      2026-08-23 逐條驗 blocker status 時發現：原本標 not_started，實際上實作是完整的。
        · scripts/aris-memory.py:458 `def query(..., confidence_gte="")`
          docstring 明寫「支援全文檢索 + 來源過濾 + 分頁 + confidence 過濾」
        · SQL 用 CASE confidence WHEN 'red' THEN 0 ... >= ? 做閾值比較
        · tests/test_aris_memory.py 有 6 個案例守著，其中一個是反向測試
          （檔頭寫「故意改壞 confidence_gte SQL → 測試 7 紅 ✅」）

      **但全 repo 搜 confidence_gte，命中全部在 tests/，零個生產呼叫端。**
      （正對照：同樣搜法搜 after_id 得 27 個命中，所以那個「零」是真的零。）

      所以正確狀態是 partial 而非 not_started —— 這兩者對讀的人意義完全不同：
      not_started 會讓人以為要從頭寫，實際上只差把參數接上去。

      ⚠️ 這是本檔 risks:doc-lies 的第三種形態。前兩種是「宣稱有但沒接線」
      （confidence-gate 的欄位）與「假缺口」（sealed:rust-psi）；這條是
      **「做好了、測試守著、但沒有人叫它」** —— 能力存在而不被使用，
      在任何檢查裡都不會亮紅燈，因為測試是綠的。

