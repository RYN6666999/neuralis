  - id: gbrain快取
    label: gbrain 快取命中率
    status: partial
    metric: 64%（⚠️ 來源不明，見 evidence —— 引用前先重測）
    blocks: [因果鏈前瞻]
    src: 管線地圖 §6 §11 #26
    evidence: |
      ⚠️ 2026-08-23 逐條驗 blocker 時，**找不到這個 64% 的量測來源**。
      搜「快取命中」全 repo，命中的是：
        · laap/llm_respond.py:435  工具快取命中（LLM 層，不是 gbrain）
        · laap/llm_respond.py:888  LLM 回應快取命中
        · laap/chatflow.py:405     bootstrap 快取（wake_ids）
      三個都不是 gbrain 快取。沒有找到任何會算出「gbrain 快取命中率」的程式碼。

      這個數字可能來自管線地圖 §26 的一次人工量測（2026-07-26 前後），
      也可能是估計值。無論何者，**它沒有 verify 指令，也沒有可重跑的來源**。

      ⚠️ 沒有量測來源的 metric 跟過期的 metric 一樣危險，而且更難發現：
      它看起來精確（有小數點等級的具體性），所以沒有人會想去查它。
      在補上量測方式之前，不要拿這個數字做任何決策。

      待辦（不是本輪範圍）：找出「gbrain 快取」實際指哪一層，
      補一個像 confidence-gate 那樣的 verify 指令。

