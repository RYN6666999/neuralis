# ── 封印：能開但刻意沒開。解封成本 vs 收益 ──
sealed:
  # ⚠️ 2026-08-23：這個封印**已不成立**，三項宣稱逐條被實測推翻（見 note）。
  #    保留條目是為了不動 brain/blast.py 依賴的結構；保留不等於它還封著。
  - id: rust-psi
    label: Rust PSI Backend 接線（封印已失效，見 note）
    why: （2026-07-27 原文，已過期）RustPsiBackend class 建好，但 startup.py 沒接。先試 Rust 失敗就降級 Python，Python 夠用所以沒人修。
    unseal_cost: low
    unseal_gain: 2000 ticks/s · p99 4µs
    hard_blocker: （2026-07-27 原文，已過期）rustc 未安裝
    src: 管線地圖 §6 §11 #18 #29
    note: |
      2026-08-23 實測，上面三項宣稱全部不成立：
        · hard_blocker「rustc 未安裝」 → rustc 1.97.0 在 ~/.cargo/bin/rustc
        · 「startup.py 沒接」          → laap/startup.py:52 起有完整 RustPsiBackend 接線
        · 封印（= 刻意沒開）           → psi-daemon 正在跑，已連續 3 天
                                         （launchd com.neuralis.psi-daemon；三種方法
                                          交叉確認：pgrep -f / ps -p / launchctl list）
        · 編譯產物 rust/target/release/psi-daemon 557.9K 存在
      topology.yaml 的 rust-psi-daemon node 記著「2026-08-01 打通 M3 B-route」——
      這條在 causal 躺了三週沒更新，而 topology 早就記錄完成了。兩份分工是硬的，
      但沒有任何機制在比對它們，所以誰也沒發現對方已經走遠。

      ⚠️ 這是本檔 risks:doc-lies 的實例，而且是最難發現的形態：**假缺口**。
      假綠燈讓人不去查真問題；**假缺口讓人以為還有事要做 ——
      而沒有人會質疑一個開著的 ticket。** 它不觸發任何告警，
      只是安靜地讓每一份規劃都繞過一個其實已經可用的能力。

      未解的部分（真的還沒做，不要連帶當成完成）：
        · Python 與 Rust 的數值對拍從未做過（無 test_psi_numeric_parity.py）
        · topology.yaml 的 rust_compare_python 邊標 expect: fail，指的就是這件事

