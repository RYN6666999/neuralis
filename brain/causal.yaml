# ── 已知風險：探測不到但會咬人 ──
risks:
  - id: scream-stale
    severity: high
    what: Scream 本地 0.10.0，npm latest 0.14.3 — 落後 43 版
    why: |
      身體是 npm 全域安裝（/opt/homebrew/lib/node_modules/scream-code），不是原始碼。
      ~/Developer/neuralis/scream-code/ 只有 mcp.json，是設定不是碼 —— 所以「無 .git」
      本身不是問題，這裡從來不該有 git。真正的問題是版本落後 43 版。
    fix: npm i -g scream-code@latest（升級前先確認 config.toml 相容）
    detected_by: npm view scream-code version 2026-08-23 實測
    note: |
      2026-08-23 更新：前次記錄「latest 0.10.13、落後 13 版」是 2026-07-27 的值。
      一個月後上游走到 0.14.3，落差從 13 版變成 43 版，而這裡的數字沒有跟著動。
      ⚠️ 版本落差是流動量不是靜態量 —— 引用時必須連量測日期一起帶，
      否則下一個人會照抄一個過期的數字去做升級決策。
      brain/upgrade-scream.md 的「先不升」結論是在落後 13 版的前提下做的，
      落後 43 版之後值不值得重估，由 Ryan 決定。

      （併入原 note）前一版 causal.yaml 曾記為 scream-no-git（誤判：以為該目錄是
      原始碼）。這正是 doc-lies 風險的實例 —— 連我自己也會誤判，所以一切以實測為準。

  - id: laap-diverged
    severity: medium
    what: 本地 laap-AGI 在 main@94b9b58，與 upstream 分叉狀態需 drift.py 實查
    why: 上游 lorryjovens-hub 一動可能靜默漂移，且本地有未提交變更
    fix: brain/drift.py 監測（已實作）；決定要跟上游還是長期分叉
    detected_by: git -C ~/Developer/laap-AGI rev-parse 2026-08-23 實測
    note: |
      2026-08-23 更新：前次記錄「本地 feat/env-config-hermes@7f02b62」已過期 ——
      分支與 commit 都變了，實測在 main@94b9b58。
      ⚠️ 這裡刻意不再寫死 upstream/main 的 sha（原文寫 c3d495c）：
      那個值要打網路才問得到，寫進靜態檔案就是在製造下一個過期宣稱。
      要比對分叉跑 brain/drift.py —— 它會實查，這裡只記本地端。

  - id: origin-all-auto
    severity: high
    what: 152/152 筆記憶的 origin 都是 auto_generated，零筆標 human
    why: |
      Ryan 說的話和 AI 自己說的話在資料庫裡權重相同。
      AI 讀回自己的推測，會誤認為是事實 → 自我強化迴路（self-reinforcement）。
      這比「記錯」更危險：記錯可以查，自我強化會越查越確信。
    fix: 寫入端依來源分流 —— webchat/ob 來源標 human，aris-self 標 auto_generated
    detected_by: brain/memcheck.py 2026-07-27 實測
    blocks_ref: confidence-gate

  - id: gbrain-never-synced
    severity: high
    what: synced_to_gbrain 0/152，而 ~/gbrain 有 4697 個 md
    why: |
      L2 語意層（gbrain）和 L3 長期層（.aris-memory.db）是兩座孤島。
      海馬迴 → 皮質的升格（固化）實際沒在跑，只是 schema 裡有這個欄位。
      後果：新記憶永遠查不到舊知識，舊知識永遠不知道新發生了什麼。
    fix: 固化 cron（見 blockers.固化cron，被 confidence-gate 卡住）
    detected_by: brain/memcheck.py 2026-07-27 實測
    blocks_ref: 固化cron

  - id: aris-mem-no-auth
    severity: medium
    what: aris-mem.* tunnel 無 bearer token
    src: 管線地圖 §11 #19

  - id: doc-lies
    severity: high
    what: 文件宣稱的功能實際不存在
    evidence: _現況.md 宣稱 relay 雙寫（commit 3b966ae），實查該 hash 不在 neuralis
    fix: 只信 probe 端到端實跑，不信 grep 原始碼
    src: topology.yaml 開頭 · 管線地圖 §9
    note: 這是本專案最重要的一條紀律。brain/ 產出的所有 .md 都是生成物，不可手改。
