# ── 2026-08-23 批次標記 expect: fail 的依據與限度（讀之前先看這段）────────
#
# 下面 7 條新標的 `expect: fail`，依據是**節點層實測**，不是 probe 實測：
#   · 11546 / 11550 無人監聽 —— lsof 全列 + nc 兩種方法交叉確認
#   · 留言板.md 不存在 —— find 全 vault，同目錄 20 檔為正對照
#   · aris-relay launchd 層 disabled + log 檔從未產生
# 也就是說：**這幾條的兩端有一端根本不存在，邊不可能通。**
#
# ⚠️ 刻意沒跑 probe.py 來標：它有寫入副作用（aris_to_memory 的 check 是
#    「注一筆 kick → DB rows +1」），而這次的範圍是純文件更新、零風險。
#    本檔前科第一條正是「標 expect: fail 但 probe 實測是綠的 —— 手標的過期標記」，
#    所以這裡把依據寫死：**節點死 ⇒ 邊死**，這個推論不需要 probe 也成立。
#
# ⚠️ 反過來不成立：節點活不代表邊通。等那些服務重新上線時，
#    這些 expect: fail 必須逐條拿掉並用 probe 真跑一次，不要因為「服務開了」就假設綠。
#
# ⚠️ 沒有刪任何 edge：scripts/probe.py:642 `set(edges) ^ set(PROBES)` 是硬鎖，
#    少一條邊就 return 2，整組健康檢查靜默拒跑（本檔前科第 6 條）。

edges:
  - id: board_to_channel
    from: board
    to: bridge
    via: _message_board_watcher
    expect: fail   # 2026-08-23：board 機制已廢除，留言板.md 不存在
    contract: direction=scream→aris · type=kick · 必須有 id（三者缺一就進不了主迴圈）
    note: 2026-07-26 修好前這條斷了，通知寫進沒人讀的 channel
    check: 留言板 mtime 變動 → channel 出現一筆合格 entry

  - id: channel_to_aris
    from: bridge
    to: aris-api
    via: main_loop 分支 B
    expect: fail   # 2026-08-23：aris-api(11546) 無人監聽
    contract: kick 進來 → POST 11546 → 回覆非空
    check: 注一筆 kick → bridge log 出現「✅ Aris 回應」

  - id: aris_to_memory
    from: bridge
    to: aris-memory
    via: _store_aris_memory
    contract: 每個 turn 一筆 · attention_line 從 ⟶下一步 切出 · salience 標記不得殘留在 content
    check: 注 kick → DB rows +1

  - id: webchat_to_memory
    from: relay
    to: aris-memory
    via: aris-relay._remember（共用 aris_memory_client，與 bridge 同一套 marker 規則）
    expect: fail   # 2026-08-23：relay(11550) 無人監聽 + launchd disabled
    contract: |
      webchat 每輪雙筆：使用者說的（source=webchat）+ Aris 回的（source=aris-self）。
      attention_line 只掛 aris-self 那筆。標記必須在回給前端之前剝掉。
    note: |
      _現況.md 曾宣稱這條 2026-07-25 上線（commit 3b966ae），實查為假：
      該 hash 不在 neuralis，且 aris-relay.py 歷史上從沒出現過 memories/store。
      2026-07-26 真的接上。probe 是端到端的（真打一輪），不是 grep 原始碼。
    check: POST 11550 /c 一輪 → DB rows +2 且 source = webchat + aris-self

  - id: memos_to_gbrain
    from: memos
    to: gbrain
    via: scripts/consolidate-memos.py（夜班）
    contract: what_worked 非空 → 原文寫 mem/YYYY-MM-DD · 冪等（重建整天不 append）
    check: --dry-run 能列出待固化天數且不報錯

  # 讀取匯流：三源合一，這是唯一入口
  - id: wake_reads_three
    from: [aris-memory, memos, board]
    to: aris-api
    via: aris_memory.wake_context
    expect: fail   # 2026-08-23：aris-api(11546) 未監聽、board 機制已廢除
    contract: 任一源掛掉跳過該塊，永不擋醒來 · 至少要有一源出東西
    check: GET /wake → context 非空且含 ≥1 個【】區塊標題

  - id: bridge_scoring_router
    from: bridge
    to: bridge
    via: startup import check（contracts.verdict_v2 + scoring）
    contract: scoring router import 成功 → ④ Gate 活著 · 失敗 → bridge 靜默降級（log 一行，無 alarm）
    note: 2026-07-26 證實此閘死過：plist 指 laapenv/bin/python 但實際用 homebrew 3.12 → pydantic 消失 → import fail → 系統照跑但 Gate 全開。probe 用自己 interpreter 測不出來。
    check: "bridge log 最後一次重啟含「Scoring Router canary bridge: enabled」"

  - id: relay_remembers_turn
    from: relay
    to: aris-api
    via: process_worker messages 組裝（2026-08-01 加：撈前幾輪 history 注入 messages）
    expect: fail   # 2026-08-23：兩端皆死：relay(11550) + aris-api(11546)
    contract: 同 conversation_id 的前幾輪要回放進 messages
    check: 兩輪哨兵，第二輪知道剛剛有代號被給過（不要求 exact match—Aris 會幻覺具體內容）

  - id: recall_not_selfinflated
    from: relay
    to: aris-memory
    via: _remember
    expect: fail   # 2026-08-23：relay(11550) 無人監聽 + launchd disabled
    contract: discovered_salience 只能由真 recall 賺，寫入端不得自發
    check: 新寫入的 aris-self 記憶 ds=0 且 total_recalls=0

  - id: wake_reaches_prompt
    from: aris-memory
    to: aris-api
    via: chatflow._session_bootstrap_memories
    expect: fail
    contract: /wake 三源內容必須真的進到 system prompt
    note: wake_reads_three 只驗源頭有出東西，沒驗有沒有到終點。這條補另一半。
    check: 塞哨兵 attention_line → 問 Aris 懸著什麼 → 回覆含哨兵

  # ── 雙體驗證邊（2026-07-29 加）─────────────────────────

  - id: psi_evaluator_state
    from: psi-evaluator
    to: psi-evaluator
    via: PsiBridge.save_state
    contract: 注入 need_bias → psi_state.json 的 needs 值正確更新
    check: "寫 competence=0.1 → 讀回 0.1（probe.py: probe_psi_state）"

  - id: evaluator_audit
    from: [psi-evaluator, cloud-evaluator]
    to: psi-evaluator
    via: evaluate.py 的 audit 寫入
    contract: "每次評估寫一筆到 audit/，JSON schema 正確"
    check: "寫測試報告 → 讀回驗證 schema（probe.py: probe_audit_write）"

  - id: dual_evaluation_compare
    from: psi-evaluator
    to: cloud-evaluator
    via: evaluate.py 的 compare_reports
    contract: "同一份 log，PSI 和 Cloud 各自評估，比對不一致"
    check: "跑 evaluate.py → 不一致分析檔案非空"

  # ── Rust PSI M3 B-route 邊（2026-08-01 加）────────────────────

  - id: rust_b1_read
    from: rust-psi-daemon
    to: aris-api
    via: RustPsiBackend._read_raw → _remap
    expect: fail   # 2026-08-23：aris-api(11546) 無人監聽
    contract: daemon 每 100ms 寫 atomic state → RustPsiBackend 讀 latest.json → remap 成 Python dict
    check: spawn daemon → RustPsiBackend.get_state() 回 tick>0 且 schema=neuralis-rust-psi/v1

  - id: rust_b2_write
    from: aris-api
    to: rust-psi-daemon
    via: RustPsiBackend._write_event → FIFO → daemon reader thread
    expect: fail   # 2026-08-23：aris-api(11546) 無人監聽
    contract: process_input/satisfy/post_affective_event 寫 "EventName,intensity\\n" 到 FIFO → daemon post 進 ring buffer
    check: write SocialPraise,1.0 到 FIFO → daemon log 無錯誤 → 5 秒後 tick 增加

  - id: rust_compare_python
    from: aris-api
    to: rust-psi-daemon
    via: 對拍測試 /tmp/psi-compare.py
    expect: fail
    contract: 同一組 keyword 輸入 → PythonPsiBackend vs RustPsiBackend 的 dominant_need 一致
    check: python3 /tmp/psi-compare.py 回 exit 0（需要 Python 和 Rust 兩邊都 alive）

  - id: aris_growth_check
    from: aris-api
    to: aris-api
